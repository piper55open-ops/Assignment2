<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Travel Mate</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to your Travel Mate account</p>

            <form method="POST" action="/login">
                <select name="role" id="role-select" required>
                    <option value="">Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="traveller">Traveller</option>
                    <option value="provider">Accommodation Provider</option>
                </select>

                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit">Login</button>
            </form>

            <div class="links">
                <p>New user? <a href="{{ url_for('register') }}">Register here</a></p>
                <a href="{{ url_for('home') }}" class="home-link">🏠 Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const body = document.body;
        const roleSelect = document.getElementById("role-select");

        roleSelect.addEventListener("change", function() {
            body.className = ""; // reset
            if (this.value) {
                body.classList.add(this.value);
            }
        });
    </script>
</body>
</html>
