<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Travel Mate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="subtitle">Create Your Travel Mate account</p>
            <form method="POST" enctype="multipart/form-data">
                
                    <img id="imgPreview" class="profile-img-preview" alt="Preview">
                    <input type="file" name="image" accept="image/*"  onchange="previewImage(event)">
                    <input type="text" name="username" placeholder="Username"  required>
           
               
                    <input type="email" name="email" placeholder="Email"  required>
                
                    <input type="password" name="password" placeholder="Password"  required>
               
                   <select name="role" id="role-select" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="tourist">Traveller</option>
                        <option value="provider">Accommodation Provider</option>
                        <option value="admin">Admin</option>
                    </select>
                
                <button type="submit">Register</button>

                <div class="links">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                    <p><a href="{{ url_for('home') }}">← Back to Home</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const imgPreview = document.getElementById('imgPreview');
            imgPreview.src = URL.createObjectURL(event.target.files[0]);
            imgPreview.style.display = 'block';
        }
    
        const body = document.body;
        const roleSelect = document.getElementById("role-select");

        roleSelect.addEventListener("change", function() {
            body.className = ""; // reset
            if (this.value) {
                body.classList.add(this.value);
            }
        });
    </script>
</body>
</html>
