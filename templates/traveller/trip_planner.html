{% extends "traveller/traveller_base.html" %}
{% block content %}
<div class="container-fluid py-4">
  <h3 class="fw-bold mb-4">AI Trip Planner 🗺️</h3>

  <!-- Trip Details Form -->
  <div class="card mb-4 p-4 shadow-sm rounded-4">
    <form id="tripForm">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Destination</label>
          <input type="text" class="form-control" name="destination" placeholder="Rotorua" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Start Date</label>
          <input type="date" class="form-control" name="start_date" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Nights</label>
          <input type="number" class="form-control" name="nights" value="3" min="1" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Adults</label>
          <input type="number" class="form-control" name="adults" value="2" min="1" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Children</label>
          <input type="number" class="form-control" name="children" value="0" min="0" required>
        </div>
      </div>

      <div class="row g-3 mt-3">
        <div class="col-md-4">
          <label class="form-label">Budget ($)</label>
          <input type="number" class="form-control" name="budget" value="1500" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Preferences</label>
          <select class="form-select" name="preferences" multiple>
            <option value="Adventure">Adventure</option>
            <option value="Relaxation">Relaxation</option>
            <option value="Sightseeing">Sightseeing</option>
            <option value="Food">Food</option>
            <option value="Culture">Culture</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-3">Generate Itinerary</button>
    </form>
  </div>

  <!-- Map Section -->
  <div class="card mb-4 shadow-sm rounded-4 p-3">
    <h5>Select Places on Map</h5>
    <div id="tripMap" style="height:400px;"></div>
  </div>

  <!-- AI Generated Itinerary -->
  <div id="itinerary" class="row g-3"></div>
</div>

<script>
const map = L.map('tripMap').setView([-41.2865, 174.7762], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

let selectedPlaces = [];

// Example markers for demo
const places = [
  { name: "Redwoods Forest", coords: [-38.1368, 176.2497] },
  { name: "Polynesian Spa", coords: [-38.1369, 176.2470] },
  { name: "Lake Rotorua", coords: [-38.1390, 176.2460] }
];

places.forEach(p => {
  const marker = L.marker(p.coords, {icon: L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
      iconSize: [35, 35]
    })}).addTo(map).bindPopup(`<b>${p.name}</b><br><small>Click to select</small>`);

  marker.on('click', () => {
    if (!selectedPlaces.includes(p.name)) {
      selectedPlaces.push(p.name);
      marker.setOpacity(0.7); // visually mark selection
    } else {
      selectedPlaces = selectedPlaces.filter(x => x !== p.name);
      marker.setOpacity(1);
    }
  });
});

// Handle form submission
document.getElementById('tripForm').addEventListener('submit', async e => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  button.disabled = true;
  button.textContent = "Generating itinerary... 🧭";

  const formData = new FormData(e.target);
  const data = {
    destination: formData.get('destination'),
    nights: formData.get('nights'),
    adults: formData.get('adults'),
    children: formData.get('children'),
    budget: formData.get('budget'),
    preferences: Array.from(formData.getAll('preferences')),
    selected_places: selectedPlaces
  };

  try {
    const res = await fetch("/traveller/trip-planner", {
      method: "POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    
  if (!res.ok) {
    throw new Error(`HTTP ${res.status}`);
  }
    const itinerary = await res.json();
    displayItinerary(itinerary);
  } catch (err) {
    document.getElementById('itinerary').innerHTML =
      `<div class="alert alert-danger">Error generating itinerary. Please try again.</div>`;
  } finally {
    button.disabled = false;
    button.textContent = "Generate Itinerary";
  }
});

function displayItinerary(itinerary) {
  const container = document.getElementById('itinerary');
  container.innerHTML = '';

  // handle errors/invalid responses
  if (!itinerary) {
    container.innerHTML = `<div class="alert alert-warning">No itinerary returned.</div>`;
    return;
  }
  if (itinerary.error) {
    container.innerHTML = `<div class="alert alert-danger">${itinerary.error}</div>`;
    return;
  }

  // ensure it's an array
  const days = Array.isArray(itinerary) ? itinerary : [itinerary];

  days.forEach(day => {
    const card = document.createElement('div');
    card.className = 'col-md-4';

    // Use backticks for template literal
    card.innerHTML = `
      <div class="card shadow-sm rounded-4 p-3 mb-3">
        <div class="card-header bg-gradient rounded-top-3 mb-2" style="background: linear-gradient(90deg,#6dd5ed,#2193b0); color: white;">
          <h6 class="mb-0 fw-bold">Day ${day.day || '—'}</h6>
        </div>
        <div class="card-body p-2">
          <p class="mb-2"><strong>Accommodation:</strong> ${day.accommodation || 'N/A'}</p>
          <ul class="small mb-0">
            ${Array.isArray(day.activities) && day.activities.length
              ? day.activities.map(a => `<li>${a.time || ''}: ${a.name || ''} ${a.location ? ' — ' + a.location : ''}</li>`).join('')
              : '<li>No activities suggested</li>'}
          </ul>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

</script>
{% endblock %}
