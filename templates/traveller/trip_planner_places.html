{% extends "traveller/traveller_base.html" %}
{% block content %}
<section class="trip-planner container">
  <h2>🗺️ Plan Your New Zealand Trip</h2>
  <div class="planner-form">
    <label>Destination</label>
    <input type="text" id="destination" placeholder="Enter city or place">

    <label>Start Date</label>
    <input type="date" id="start_date">

    <label>Number of Nights</label>
    <input type="number" id="nights" value="3">

    <label>Adults</label>
    <input type="number" id="adults" value="2">

    <label>Children</label>
    <input type="number" id="children" value="0">

    <label>Budget (NZD)</label>
    <input type="text" id="budget" placeholder="e.g., 2000">

    <label>Preferred Activities</label>
    <input type="text" id="preferences" placeholder="Beaches, Hiking, Nature...">

    <button id="generate-plan">Generate Plan</button>
  </div>

  <div id="trip-plan-output"></div>

  <h3>🗺️ Choose Destinations on Map</h3>
  <div id="map" style="height:400px; border-radius: 10px;"></div>
</section>

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
<script src="{{ url_for('static', filename='js/trip_planner.js') }}"></script>
<script>
    let map;
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: -41.2865, lng: 174.7762 }, // Wellington default
    zoom: 6,
  });

  const input = document.getElementById("destination");
  const autocomplete = new google.maps.places.Autocomplete(input);
  autocomplete.bindTo("bounds", map);

  autocomplete.addListener("place_changed", () => {
    const place = autocomplete.getPlace();
    if (!place.geometry) return;
    map.setCenter(place.geometry.location);
    map.setZoom(10);
    new google.maps.Marker({
      map: map,
      position: place.geometry.location,
      title: place.name
    });
  });
}

window.initMap = initMap;

document.getElementById("generate-plan").addEventListener("click", async () => {
  const data = {
    destination: document.getElementById("destination").value,
    start_date: document.getElementById("start_date").value,
    nights: document.getElementById("nights").value,
    adults: document.getElementById("adults").value,
    children: document.getElementById("children").value,
    budget: document.getElementById("budget").value,
    preferences: document.getElementById("preferences").value,
  };

  const res = await fetch("/generate_plan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  const result = await res.json();

  document.getElementById("trip-plan-output").innerHTML = `
    <div class="trip-plan-box">
      <h3>🧭 Your AI Trip Plan</h3>
      <pre>${result.plan}</pre>
    </div>
  `;
});

</script>
{% endblock %}
