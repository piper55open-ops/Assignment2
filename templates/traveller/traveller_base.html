<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveller Dashboard | Travel Mate</title>

  <!-- Bootstrap + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Leaflet Map -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
   <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/traveller.css') }}">
  
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="#">
        <i class="fas fa-globe-americas me-2"></i>Travel Mate – Traveller
      </a>

      <!-- Profile Dropdown -->
      <div class="dropdown">
        <button class="btn btn-light rounded-pill dropdown-toggle px-3" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="fas fa-user-circle me-1 text-primary"></i> {{ traveller_name }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
          <li><a class="dropdown-item" href="#"><i class="fa-solid fa-id-card me-2"></i>Profile</a></li>
          <li><a class="dropdown-item" href="#"><i class="fa-solid fa-cog me-2"></i>Settings</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Layout -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 sidebar">
        <a href="{{ url_for('traveller.traveller_dashboard') }}" class="active"><i class="fas fa-home"></i> Dashboard</a>
        <a href="#"><i class="fas fa-route"></i> My Trips</a>
        <a href="#"><i class="fas fa-camera"></i> My Memories</a>
        <a href="{{ url_for('traveller.ai_planner') }}"><i class="fas fa-robot"></i> Trip Planner</a>
        <a href="#"><i class="fas fa-map-marked-alt"></i> Nearby Stays</a>
      </div>

      <!-- Main content -->
      <div class="col-md-10 content-area">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
