{% extends "admin/admin_base.html" %}

{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-uppercase text-secondary">Events Management</h3>
    <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#addEventModal">
      <i class="bi bi-calendar-plus me-2"></i>Add Event
    </button>
  </div>

  <!-- Search -->
  <div class="mb-3">
    <input type="text" id="searchEventInput" class="form-control shadow-sm" placeholder="Search events by name or date...">
  </div>

  <!-- Events Table -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body">
      <table class="table align-middle table-hover" id="eventTable">
        <thead class="table-light text-center">
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Date</th>
            <th>Location</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody class="text-center">
          {% for event in events %}
          <tr>
            <td>{{ event.id }}</td>
            <td>{{ event.title }}</td>
            <td>{{ event.date }}</td>
            <td>{{ event.location or 'N/A' }}</td>
            <td>
              <img src="{{ url_for('static', filename='images/events/' ~ event.image) }}" alt="Event" width="60" class="rounded">
            </td>
            <td>
              <button class="btn btn-sm btn-outline-gold me-2"
                      data-bs-toggle="modal"
                      data-bs-target="#updateEventModal"
                      onclick="openUpdateEventModal({{ event.id }}, '{{ event.title }}', '{{ event.description|e }}', '{{ event.date }}', '{{ event.location }}')">
                <i class="bi bi-pencil-square"></i>Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteEvent({{ event.id }})">
                <i class="bi bi-trash"></i>Delete
              </button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Event Modal -->
<div class="modal fade" id="addEventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header bg-gold text-white">
        <h5 class="modal-title fw-bold">Add New Event</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addEventForm" enctype="multipart/form-data">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" name="title" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="text" class="form-control" name="date" placeholder="e.g. Apr 10, 2026" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location">
          </div>
          <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file" class="form-control" name="image" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-gold">Save Event</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Update Event Modal -->
<div class="modal fade" id="updateEventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header bg-gold text-white">
        <h5 class="modal-title fw-bold">Update Event</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="updateEventForm" enctype="multipart/form-data">
        <div class="modal-body">
          <input type="hidden" name="event_id">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" name="title">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="text" class="form-control" name="date">
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location">
          </div>
          <div class="mb-3">
            <label class="form-label">Image (optional)</label>
            <input type="file" class="form-control" name="image" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-gold">Update Event</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // 🔍 Search
  document.getElementById("searchEventInput").addEventListener("keyup", function() {
    const filter = this.value.toLowerCase();
    document.querySelectorAll("#eventTable tbody tr").forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
  });

  // 🟤 Add Event
  document.getElementById("addEventForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const response = await fetch("/admin/events/add", { method: "POST", body: new FormData(e.target) });
    const result = await response.json();
    if(result.status === "success") location.reload();
    else alert(result.message);
  });

  // 🟤 Update Event
  document.getElementById("updateEventForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = e.target.querySelector("[name='event_id']").value;
    const response = await fetch(`/admin/events/update/${id}`, { method: "POST", body: new FormData(e.target) });
    const result = await response.json();
    if(result.status === "success") location.reload();
    else alert(result.message);
  });

  function openUpdateEventModal(id, title, desc, date, loc) {
    const form = document.getElementById("updateEventForm");
    form.querySelector("[name='event_id']").value = id;
    form.querySelector("[name='title']").value = title;
    form.querySelector("[name='description']").value = desc;
    form.querySelector("[name='date']").value = date;
    form.querySelector("[name='location']").value = loc;
  }

  // 🟤 Delete Event
  async function deleteEvent(id) {
    if(!confirm("Are you sure you want to delete this event?")) return;
    const response = await fetch(`/admin/events/delete/${id}`, { method: "DELETE" });
    const result = await response.json();
    if(result.status === "success") location.reload();
  }

  document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('hidden.bs.modal', () => {
    document.activeElement.blur(); 
  });
});

</script>
{% endblock %}
