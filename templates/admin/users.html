{% extends "admin/admin_base.html" %}

{% block content %}
<div class="container-fluid py-4">
  <!-- Header Row -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-uppercase text-secondary">User Management</h3>
    <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#addUserModal">
      <i class="bi bi-person-plus me-2"></i>Add User
    </button>
  </div>

  <!-- Search Bar -->
  <div class="mb-3">
    <input type="text" id="searchInput" class="form-control shadow-sm" placeholder="Search travellers by name, email or role...">
  </div>

  <!-- Traveller Table -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body">
      <table class="table align-middle table-hover" id="travellerTable">
        <thead class="table-light text-center">
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Profile Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody class="text-center">
          {% for user in users %}
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>
                <img src="{{ url_for('static', filename='images/' ~ user.image) }}" alt="Profile Image" class="rounded-circle" width="40" height="40">
            <td>
              <button class="btn btn-sm btn-outline-gold me-2" 
                      data-bs-toggle="modal" 
                      data-bs-target="#updateUserModal"
                      onclick="openUpdateModal('{{ user.id }}', '{{ user.username }}', '{{ user.email }}', '{{ user.role }}')">
                  <i class="bi bi-pencil-square"></i>Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="deactivateUser('{{ user.id }}')">
                  <i class="bi bi-person-x"></i>Inactive
              </button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 🟤 Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header bg-gold text-white">
        <h5 class="modal-title fw-bold">Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addUserForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-control" required>
              <option value="tourist">Tourist</option>
              <option value="provider">Provider</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-gold">Save User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 🟤 Update User Modal -->
<div class="modal fade" id="updateUserModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <div class="modal-header bg-gold text-white">
        <h5 class="modal-title fw-bold">Update User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="updateUserForm" data-userid="">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-control" required>
              <option value="tourist">Tourist</option>
              <option value="provider">Provider</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-gold">Update User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 🔍 Search & CRUD Scripts -->
<script>
 // Search filter
  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("keyup", () => {
    const filter = searchInput.value.toLowerCase();
    document.querySelectorAll("#travellerTable tbody tr").forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    });
  });

  // Add User
  document.getElementById("addUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    try {
      const response = await fetch("/admin/add_user", { method: "POST", body: formData });
      const result = await response.json();
      Swal.fire({
        icon: result.status === "success" ? "success" : "error",
        title: result.status === "success" ? "Added!" : "Error",
        text: result.message,
        timer: 2000,
        showConfirmButton: false
      });
      if(result.status === "success") {
        setTimeout(() => location.reload(), 2000);
      }
    } catch(err) {
      console.error(err);
      Swal.fire({ icon: "error", title: "Error", text: "Something went wrong!" });
    }
  });

  // Open update modal
  function openUpdateModal(id, username, email, role){
    const form = document.getElementById("updateUserForm");
    form.dataset.userid = id;
    form.querySelector('input[name="username"]').value = username;
    form.querySelector('input[name="email"]').value = email;
    form.querySelector('select[name="role"]').value = role;
  }

  // Update User
  document.getElementById("updateUserForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const userId = form.dataset.userid;
    const formData = new FormData(form);
    try {
      const response = await fetch(`/admin/update_user/${userId}`, { method: "POST", body: formData });
      const result = await response.json();
      Swal.fire({
        icon: result.status === "success" ? "success" : "error",
        title: result.status === "success" ? "Updated!" : "Error",
        text: result.message,
        timer: 2000,
        showConfirmButton: false
      });
      if(result.status === "success") {
        setTimeout(() => location.reload(), 2000);
      }
    } catch(err) {
      console.error(err);
      Swal.fire({ icon: "error", title: "Error", text: "Something went wrong!" });
    }
  });

  // Deactivate User
  async function deactivateUser(userId){
    const confirmResult = await Swal.fire({
      title: 'Are you sure?',
      text: "This will deactivate the user!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#b8860b',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Yes, deactivate!'
    });
    if(!confirmResult.isConfirmed) return;

    try {
      const response = await fetch(`/admin/deactivate_user/${userId}`, { method: "POST" });
      const result = await response.json();
      Swal.fire({
        icon: result.status === "success" ? "success" : "error",
        title: result.status === "success" ? "Deactivated!" : "Error",
        text: result.message,
        timer: 2000,
        showConfirmButton: false
      });
      if(result.status === "success") {
        setTimeout(() => location.reload(), 2000);
      }
    } catch(err) {
      console.error(err);
      Swal.fire({ icon: "error", title: "Error", text: "Something went wrong!" });
    }
  }
</script>

<!-- 🎨 Custom Styles -->
<style>
  .btn-gold {
    background-color: #b8860b;
    color: white;
    border: none;
  }
  .btn-gold:hover { background-color: #a67c00; }
  .btn-outline-gold { color: #b8860b; border: 1px solid #b8860b; }
  .btn-outline-gold:hover { background-color: #b8860b; color: #fff; }
  .bg-gold { background-color: #b8860b !important; }
  .form-control:focus {
    border-color: #b8860b;
    box-shadow: 0 0 0 0.2rem rgba(184, 134, 11, 0.25);
  }
</style>
{% endblock %}
