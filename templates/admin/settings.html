{% extends "admin/admin_base.html" %}

{% block content %}
<div class="container-fluid py-4">
  <h3 class="fw-bold text-uppercase text-secondary mb-4">System Configuration</h3>

  <!-- 🔹 Tabs -->
  <ul class="nav nav-tabs mb-4" id="settingsTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="site-tab" data-bs-toggle="tab" data-bs-target="#site" type="button" role="tab">
        Site Settings
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="footer-tab" data-bs-toggle="tab" data-bs-target="#footer" type="button" role="tab">
        Footer
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="admins-tab" data-bs-toggle="tab" data-bs-target="#admins" type="button" role="tab">
        Admin Users
      </button>
    </li>
  </ul>

  <!-- 🔹 Tab Content -->
  <div class="tab-content" id="settingsTabContent">

    <!-- 🌐 Site Settings -->
    <div class="tab-pane fade show active" id="site" role="tabpanel">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <h5 class="fw-bold mb-3">Site Logo</h5>
        <form id="logoForm" enctype="multipart/form-data">
          <div class="mb-3">
            <input type="file" name="logo" class="form-control">
          </div>
          <button type="submit" class="btn btn-gold">Upload Logo</button>
        </form>

        <hr class="my-4">

        <h5 class="fw-bold mb-3">Theme Colors</h5>
        <form id="colorsForm">
          <div class="mb-3">
            <label class="form-label">Primary Color</label>
            <input type="color" name="primary_color" value="#b8860b" class="form-control form-control-color">
          </div>
          <div class="mb-3">
            <label class="form-label">Secondary Color</label>
            <input type="color" name="secondary_color" value="#ffffff" class="form-control form-control-color">
          </div>
          <button type="submit" class="btn btn-gold">Save Colors</button>
        </form>
      </div>
    </div>

    <!-- 📝 Footer Settings -->
    <div class="tab-pane fade" id="footer" role="tabpanel">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <h5 class="fw-bold mb-3">Footer Information</h5>
        <form id="footerForm">
          <div class="mb-3">
            <label class="form-label">Footer Text</label>
            <input type="text" name="footer_text" class="form-control" placeholder="Enter footer text">
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Email</label>
            <input type="email" name="footer_email" class="form-control" placeholder="admin@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="footer_phone" class="form-control" placeholder="+64 123 456 789">
          </div>
          <button type="submit" class="btn btn-gold">Save Footer</button>
        </form>
      </div>
    </div>

    <!-- 👤 Admin Users -->
    <div class="tab-pane fade" id="admins" role="tabpanel">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <h5 class="fw-bold mb-3">Add New Admin</h5>
        <form id="newAdminForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Profile Image</label>
            <input type="file" name="image" class="form-control">
          </div>
          <button type="submit" class="btn btn-gold">Add Admin</button>
        </form>
      </div>
    </div>

  </div>
</div>

<!-- 🎨 Custom Styles -->
<style>
  .btn-gold {
    background-color: #b8860b;
    color: white;
    border: none;
  }
  .btn-gold:hover {
    background-color: #a67c00;
    color: white;
  }
</style>
{% endblock %}
