{% extends "admin/admin_base.html" %}

{% block content %}
<div class="container-fluid">

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background-color:#b08d57;color:#fff;">
                <h5>Total Users</h5>
                <h3>{{ total_users }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background-color:#f5c06f;color:#333;">
                <h5>Destinations</h5>
                <h3>{{ total_destinations }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background-color:#ffffff;color:#b08d57; border:1px solid #b08d57;">
                <h5>Events</h5>
                <h3>{{ total_events }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background-color:#b08d57;color:#fff;">
                <h5>Blogs</h5>
                <h3>{{ total_blogs }}</h3>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card p-3">
                <h5 class="card-title">Users by Role</h5>
                <canvas id="usersRoleChart" height="250"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card p-3">
                <h5 class="card-title">Top Visited Regions</h5>
                <canvas id="regionsChart" height="250"></canvas>
            </div>
        </div>
    </div>

    <!-- Future Controls / Quick Links -->
    <div class="row">
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card text-center p-3">
                <i class="fas fa-user-plus fa-2x mb-2"></i>
                <h6>Add User</h6>
            </div>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card text-center p-3">
                <i class="fas fa-map-marker-alt fa-2x mb-2"></i>
                <h6>Add Destination</h6>
            </div>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card text-center p-3">
                <i class="fas fa-calendar-alt fa-2x mb-2"></i>
                <h6>Add Event</h6>
            </div>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card text-center p-3">
                <i class="fas fa-newspaper fa-2x mb-2"></i>
                <h6>Add Blog</h6>
            </div>
        </div>
    </div>

</div>

<!-- Charts JS -->
<script>
    // Users by Role Pie Chart
    const ctxUsers = document.getElementById('usersRoleChart').getContext('2d');
    const usersRoleChart = new Chart(ctxUsers, {
        type: 'pie',
        data: {
            labels: ['Travellers', 'Providers'],
            datasets: [{
                label: 'Users',
                data: [{{ travellers_count | default(0) }}, {{ providers_count | default(0) }}],
                backgroundColor: ['#b08d57', '#f5c06f'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true
        }
    });

    // Top Visited Regions Bar Chart
    const ctxRegions = document.getElementById('regionsChart').getContext('2d');
    const regionsChart = new Chart(ctxRegions, {
        type: 'bar',
        data: {
            labels: {{ regions_labels | default([]) | safe }},
            datasets: [{
                label: 'Visits',
                data: {{ regions_data | default([]) | safe }},
                backgroundColor: '#b08d57'
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

{% endblock %}
