{% extends "admin/admin_base.html" %}

{% block content %}
<div class="container-fluid">

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-sm-6">
           <div class="card text-center p-3" style="background: linear-gradient(135deg, #65054bff, #dfa2d7ff); color:#fff;">
                <h5>Total Users</h5>
                <h3>{{ total_users }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background: linear-gradient(135deg, #65054bff, #dfa2d7ff); color:#fff;">
                <h5>Destinations</h5>
                <h3>{{ total_destinations }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background: linear-gradient(135deg, #65054bff, #dfa2d7ff); color:#fff;">
                <h5>Events</h5>
                <h3>{{ total_events }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3" style="background: linear-gradient(135deg, #65054bff, #dfa2d7ff); color:#fff;">
                <h5>Blogs</h5>
                <h3>{{ total_blogs }}</h3>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card p-3">
                <h5 class="card-title">Users by Role</h5>
                <canvas id="usersRoleChart" height="250"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card p-3">
                <h5 class="card-title">Top Visited Regions</h5>
                <canvas id="regionsChart" height="250"></canvas>
            </div>
        </div>
    </div>

    <!-- Future Controls / Quick Links -->
    <div class="row">
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('admin.admin_users') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-user-plus fa-2x mb-2"></i>
                    <h6>Add User</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('admin.admin_blogs') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-map-marker-alt fa-2x mb-2"></i>
                    <h6>Add Blog </h6>
                </div>
            </a>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('admin.admin_events') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-calendar-alt fa-2x mb-2"></i>
                    <h6>Add Event</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('admin.admin_settings') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-cog fa-2x mb-2"></i>
                    <h6>Go To Settings</h6>
                </div>
            </a>
        </div>
</div>

</div>

<!-- Charts JS -->
<script>
    // Users by Role Pie Chart
    const ctxUsers = document.getElementById('usersRoleChart').getContext('2d');
    const usersRoleChart = new Chart(ctxUsers, {
        type: 'pie',
        data: {
            labels: ['Travellers', 'Providers'],
            datasets: [{
                label: 'Users',
                data: [{{ travellers_count | default(0) }}, {{ providers_count | default(0) }}],
                backgroundColor: ['#9f1b50ff', '#d76bccff'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true
        }
    });

    // Top Visited Regions Bar Chart
    // Top Visited Regions Bar Chart
const ctxRegions = document.getElementById('regionsChart').getContext('2d');
const regionsChart = new Chart(ctxRegions, {
    type: 'bar',
    data: {
        labels: {{ regions_labels | safe }},
        datasets: [{
            label: 'Visits',
            data: {{ regions_data | safe }},
            backgroundColor: '#5b0943ff'
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: { beginAtZero: true }
        }
    }
});

</script>

{% endblock %}
