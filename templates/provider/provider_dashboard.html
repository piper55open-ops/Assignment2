{% extends "provider/provider_base.html" %}

{% block content %}
<div class="container-fluid">

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3 text-white" style="background: linear-gradient(135deg, #1abc9c, #16a085);">
                <h5>Total Properties</h5>
                <h3><i class="fa-solid fa-hotel me-1"></i> {{ total_properties }}</h3>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card text-center p-3 text-white" style="background: linear-gradient(135deg, #3498db, #2980b9);">
                <h5>Total Promotions</h5>
                <h3><i class="fa-solid fa-tags me-1"></i> {{ total_promotions }}</h3>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card text-center p-3" style="background-color:#007bff;color:#fff;">
                <h5>Profile Completion</h5>
                <h3>{{ profile_completion }}%</h3>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card p-3">
                <h5 class="card-title">Promotion Performance</h5>
                <canvas id="promotionsChart" height="250"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card p-3">
                <h5 class="card-title">Properties Overview</h5>
                <canvas id="propertiesChart" height="250"></canvas>
            </div>
        </div>
    </div>

    <!-- Quick Links -->
    <div class="row">
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('provider.properties') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-home fa-2x mb-2"></i>
                    <h6>Add Property</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('provider.promotions') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-tags fa-2x mb-2"></i>
                    <h6>Manage Promotions</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3 col-sm-6 mb-3">
            <a href="{{ url_for('provider.profile') }}" class="text-decoration-none">
                <div class="card text-center p-3 shadow-sm">
                    <i class="fas fa-cog fa-2x mb-2"></i>
                    <h6>Go To Profile</h6>
                </div>
            </a>
        </div>
    </div>

</div>

<!-- Charts JS -->
<script>
    // Promotions Chart
    const ctxPromotions = document.getElementById('promotionsChart').getContext('2d');
    const promotionsChart = new Chart(ctxPromotions, {
        type: 'pie',
        data: {
            labels: ['Active', 'Expired'],
            datasets: [{
                label: 'Promotions',
                data: [{{ active_promotions | default(0) }}, {{ expired_promotions | default(0) }}],
                backgroundColor: ['#007bff', '#5dade2'],
                borderWidth: 1
            }]
        },
        options: { responsive: true }
    });

    // Properties Chart (example: show distribution of property types)
    const ctxProperties = document.getElementById('propertiesChart').getContext('2d');
    const propertiesChart = new Chart(ctxProperties, {
        type: 'bar',
        data: {
            labels: {{ property_types | default([]) | safe }},
            datasets: [{
                label: 'Properties',
                data: {{ property_counts | default([]) | safe }},
                backgroundColor: '#007bff'
            }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });
</script>
{% endblock %}
