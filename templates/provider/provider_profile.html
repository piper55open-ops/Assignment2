{% extends "provider/provider_base.html" %}

{% block title %}Profile & Preferences{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <h3 class="fw-bold text-uppercase text-secondary mb-4">Profile & Preferences</h3>

  <!-- 🔹 Tabs -->
  <ul class="nav nav-tabs mb-4" id="profileTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab">
        Profile Details
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="theme-tab" data-bs-toggle="tab" data-bs-target="#theme" type="button" role="tab">
        Dashboard Theme
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="language-tab" data-bs-toggle="tab" data-bs-target="#language" type="button" role="tab">
        Language
      </button>
    </li>
  </ul>

  <!-- 🔹 Tab Content -->
  <div class="tab-content" id="profileTabContent">

    <!-- 👤 Profile Details -->
    <div class="tab-pane fade show active" id="profile" role="tabpanel">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <form id="profileForm" enctype="multipart/form-data" method="POST" action="{{ url_for('provider.update_profile') }}">
          <div class="mb-3">
            <label class="form-label">Hotel Address</label>
            <input type="text" name="hotel_address" class="form-control" value="{{ provider.hotel_address }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Profile Image</label>
            <input type="file" name="image" class="form-control">
            {% if provider.image %}
            <img src="{{ url_for('static', filename='images/' ~ provider.image) }}" class="rounded mt-2" width="100">
            {% endif %}
          </div>
          <button type="submit" class="btn btn-gold">Update Profile</button>
        </form>
      </div>
    </div>

    <!-- 🎨 Dashboard Theme -->
    <div class="tab-pane fade" id="theme" role="tabpanel">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <div class="mb-3">
          <label class="form-label">Select Theme Color</label>
          <select id="themeColorSelect" class="form-select">
            <option value="gold">Gold (Default)</option>
            <option value="blue">Blue</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 🌐 Language Settings -->
    <div class="tab-pane fade" id="language" role="tabpanel">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <div class="mb-3">
          <label class="form-label">Select Language</label>
          <select id="languageSelect" class="form-select">
            <option value="en">English</option>
            <option value="zh">Chinese</option>
            <option value="mou">Māori (MOURYA)</option>
          </select>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
    const themeSelect = document.getElementById("themeColorSelect");
    const languageSelect = document.getElementById("languageSelect");

    // Sidebar & Navbar elements to update dynamically
    const sidebarLinks = document.querySelectorAll("#sidebar .nav-link span");
    const navbarBrand = document.querySelector(".navbar-brand");

    // Translation dictionary
    const translations = {
        en: {
            dashboard: "Dashboard",
            properties: "My Properties",
            promotions: "Promotions",
            profile: "Profile",
            settings: "Settings",
            logout: "Logout"
        },
        zh: {
            dashboard: "仪表板",
            properties: "我的房产",
            promotions: "促销",
            profile: "个人资料",
            settings: "设置",
            logout: "登出"
        },
        mou: {
            dashboard: "Raupapa",
            properties: "Oku Whare",
            promotions: "Whakatairanga",
            profile: "Kōtaha",
            settings: "Tautuhinga",
            logout: "Rauwhi"
        }
    };

    // Apply saved theme from cookie
    const savedTheme = getCookie("theme_color") || "gold";
    applyTheme(savedTheme);
    if (themeSelect) themeSelect.value = savedTheme;

    // Apply saved language from cookie
    let savedLang = getCookie("language") || "en";
    if (languageSelect) languageSelect.value = savedLang;
    applyLanguage(savedLang);

    // Theme change
    if (themeSelect) {
        themeSelect.addEventListener("change", function() {
            const theme = this.value;
            applyTheme(theme);
            setCookie("theme_color", theme, 365);
        });
    }

    // Language change
    if (languageSelect) {
        languageSelect.addEventListener("change", function() {
            const lang = this.value;
            setCookie("language", lang, 365);
            applyLanguage(lang);
        });
    }

    // Apply theme (sidebar, navbar, buttons)
    function applyTheme(theme) {
        const sidebar = document.getElementById("sidebar");
        const navbar = document.querySelector(".navbar");
        if (!sidebar || !navbar) return;

        switch(theme) {
            case "gold":
                sidebar.style.backgroundColor = "#b8860b";
                navbar.style.backgroundColor = "#ffffffff";
                document.querySelectorAll(".btn-gold").forEach(btn => btn.style.backgroundColor = "#b8860b");
                break;
            case "blue":
                sidebar.style.backgroundColor = "#007bff";
                navbar.style.backgroundColor = "#f9fbfcff";
                document.querySelectorAll(".btn-gold").forEach(btn => btn.style.backgroundColor = "#007bff");
                break;
            case "dark":
                sidebar.style.backgroundColor = "#343a40";
                navbar.style.backgroundColor = "#fefefeff";
                document.querySelectorAll(".btn-gold").forEach(btn => btn.style.backgroundColor = "#6c757d");
                break;
        }
    }

    // Apply language dynamically
    function applyLanguage(lang) {
        if (!translations[lang]) return;
        sidebarLinks[0].textContent = translations[lang].dashboard;
        sidebarLinks[1].textContent = translations[lang].properties;
        sidebarLinks[2].textContent = translations[lang].promotions;
        sidebarLinks[3].textContent = translations[lang].profile;
        sidebarLinks[4].textContent = translations[lang].settings;
        sidebarLinks[5].textContent = translations[lang].logout;

        if (navbarBrand) navbarBrand.textContent = translations[lang].dashboard;
    }

    // Cookie helpers
    function setCookie(name, value, days) {
        const d = new Date();
        d.setTime(d.getTime() + (days*24*60*60*1000));
        document.cookie = name + "=" + value + ";path=/;expires=" + d.toUTCString();
    }

    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
    }
});
</script>

{% endblock %}
