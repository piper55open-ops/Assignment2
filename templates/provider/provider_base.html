<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Provider Dashboard{% endblock %}</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/provider.css') }}">

</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar" class="d-flex flex-column">
    <div class="text-center py-3 mb-3 border-bottom border-light">
      <h4 class="fw-bold text-white">Provider</h4>
    </div>

    <nav class="nav flex-column">
      <a class="nav-link active" href="{{ url_for('provider.provider_dashboard') }}">
        <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa-solid fa-hotel"></i> <span>My Properties</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa-solid fa-plus-circle"></i> <span>Add Property</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa-solid fa-bullhorn"></i> <span>Promotions</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa-solid fa-plus"></i> <span>Add Promotion</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa-solid fa-user-circle"></i> <span>Profile</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa-solid fa-gear"></i> <span>Settings</span>
      </a>
      <a class="nav-link" href="{{ url_for('logout') }}">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </a>
    </nav>

    <div class="mt-auto text-center mb-3">
      <button id="toggleSidebar" class="btn btn-light btn-sm">Toggle</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <nav class="navbar navbar-expand-lg mb-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Provider Dashboard</span>
        <div class="d-flex align-items-center">
          <img src="{{ url_for('static', filename='images/' ~ provider['image']) }}"
               alt="{{ provider['username'] }}" 
               class="rounded-circle me-2"
               width="40" height="40">
          <span class="fw-semibold">{{ provider['username'] }}</span>
        </div>
      </div>
    </nav>

    {% block content %}
    {% endblock %}
  </div>
  
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleSidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });
  </script>
</body>
</html>
