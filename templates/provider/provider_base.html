<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Provider Dashboard{% endblock %}</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/provider.css') }}">

</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar" class="d-flex flex-column">
    <div class="text-center py-3 mb-3 border-bottom border-light">
      <h4 class="fw-bold text-white">Provider</h4>
    </div>

    <nav class="nav flex-column">
      <a class="nav-link active" href="{{ url_for('provider.provider_dashboard') }}">
        <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
      </a>
      <a class="nav-link" href="{{ url_for('provider.properties') }}">
        <i class="fa-solid fa-hotel"></i> <span>My Properties</span>
      </a>
      <a class="nav-link" href="{{ url_for('provider.promotions') }}">
        <i class="fa-solid fa-bullhorn"></i> <span>Promotions</span>
      </a>
      <a class="nav-link" href="{{ url_for('provider.profile') }}">
        <i class="fa-solid fa-user-circle"></i> <span>Profile</span>
      </a>
      <a class="nav-link" href="{{ url_for('logout') }}">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </a>
    </nav>

    <div class="mt-auto text-center mb-3">
     <i class=" btn btn-light btn-sm fi fi-bs-play-alt" id="toggleSidebar" ></i>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <nav class="navbar navbar-expand-lg mb-4">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Provider Dashboard</span>
        <div class="d-flex align-items-center">
          <img src="{{ url_for('static', filename='images/' ~ provider['image']) }}"
               alt="{{ provider['username'] }}" 
               class="rounded-circle me-2"
               width="40" height="40">
          <span class="fw-semibold">{{ provider['username'] }}</span>
        </div>
      </div>
    </nav>

    {% block content %}
    {% endblock %}
  </div>
  
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <script>
window.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("sidebar");
    const navbar = document.querySelector(".navbar");
    const sidebarLinks = document.querySelectorAll("#sidebar .nav-link span");
    const navbarBrand = document.querySelector(".navbar-brand");

    // Translation dictionary
    const translations = {
        en: {
            dashboard: "Dashboard",
            properties: "My Properties",
            promotions: "Promotions",
            profile: "Profile",
            settings: "Settings",
            logout: "Logout"
        },
        zh: {
            dashboard: "仪表板",
            properties: "我的房产",
            promotions: "促销",
            profile: "个人资料",
            settings: "设置",
            logout: "登出"
        },
        mou: {
            dashboard: "Raupapa",
            properties: "Oku Whare",
            promotions: "Whakatairanga",
            profile: "Kōtaha",
            settings: "Tautuhinga",
            logout: "Rauwhi"
        }
    };

    // Apply saved theme and language on every page load
    const savedTheme = getCookie("theme_color") || "gold";
    const savedLang = getCookie("language") || "en";
    applyTheme(savedTheme);
    applyLanguage(savedLang);

    // Apply theme
    function applyTheme(theme) {
        if (!sidebar || !navbar) return;
        switch(theme) {
            case "gold":
                sidebar.style.backgroundColor = "#b8860b";
                navbar.style.backgroundColor = "#b8860b";
                document.querySelectorAll(".btn-gold").forEach(btn => btn.style.backgroundColor = "#b8860b");
                break;
            case "blue":
                sidebar.style.backgroundColor = "#007bff";
                navbar.style.backgroundColor = "#007bff";
                document.querySelectorAll(".btn-gold").forEach(btn => btn.style.backgroundColor = "#007bff");
                break;
            case "dark":
                sidebar.style.backgroundColor = "#343a40";
                navbar.style.backgroundColor = "#343a40";
                document.querySelectorAll(".btn-gold").forEach(btn => btn.style.backgroundColor = "#6c757d");
                break;
        }
    }

    // Apply language
    function applyLanguage(lang) {
        if (!translations[lang]) return;
        if (sidebarLinks.length >= 6) {
            sidebarLinks[0].textContent = translations[lang].dashboard;
            sidebarLinks[1].textContent = translations[lang].properties;
            sidebarLinks[2].textContent = translations[lang].promotions;
            sidebarLinks[3].textContent = translations[lang].profile;
            sidebarLinks[4].textContent = translations[lang].settings;
            sidebarLinks[5].textContent = translations[lang].logout;
        }
        if (navbarBrand) navbarBrand.textContent = translations[lang].dashboard;
    }

    // Cookie helpers
    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
    }
});
</script>



</body>
</html>
