<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Provider Dashboard{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
     <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/provider.css') }}">

  
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar" class="d-flex flex-column">
    <div class="sidebar-header">Provider Panel</div>

    <nav class="nav flex-column">
      <a class="nav-link {% if request.endpoint=='provider.provider_dashboard' %}active{% endif %}" href="{{ url_for('provider.provider_dashboard') }}">
        <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
      </a>
      <a class="nav-link {% if request.endpoint=='provider.properties' %}active{% endif %}" href="{{ url_for('provider.properties') }}">
        <i class="fa-solid fa-hotel"></i> <span>Properties</span>
      </a>
      <a class="nav-link {% if request.endpoint=='provider.promotions' %}active{% endif %}" href="{{ url_for('provider.promotions') }}">
        <i class="fa-solid fa-bullhorn"></i> <span>Promotions</span>
      </a>
      <a class="nav-link {% if request.endpoint=='provider.profile' %}active{% endif %}" href="{{ url_for('provider.profile') }}">
        <i class="fa-solid fa-user-circle"></i> <span>Profile</span>
      </a>
      <a class="nav-link" href="{{ url_for('logout') }}">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </a>
    </nav>

    <div class="mt-auto text-center mb-3">
      <i class="btn btn-light btn-sm" id="toggleSidebar"><i class="fas fa-angle-double-left"></i></i>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <nav class="navbar navbar-expand-lg mb-4">
      <div class="container-fluid">
        <div class="ms-auto">
            <img src="{{ url_for('static', filename='images/' ~ provider['image']) }}"
                alt="{{ provider['username'] }}" 
                class="rounded-circle me-2"
                width="40" height="40">
            <span class="fw-semibold">{{ provider['username'] }}</span>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // Sidebar toggle
    const toggleBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('main-content');

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('collapsed');
        toggleBtn.querySelector('i').classList.toggle('fa-angle-double-left');
        toggleBtn.querySelector('i').classList.toggle('fa-angle-double-right');
    });
  </script>
</body>
</html>
